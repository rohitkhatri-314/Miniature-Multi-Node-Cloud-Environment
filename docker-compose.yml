services:
  # Management / Controller Node
  ctrl-node:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: ctrl-node
    hostname: ctrl-node
    privileged: true
    volumes:
      - ./controller:/opt/controller
      - ./logs:/var/log/minicloud
      - ./ssh_keys:/root/.ssh_shared
    networks:
      mgmt_net:
        ipv4_address: 192.168.100.10
    ports:
      - "2220:22"
    command: /usr/local/bin/entrypoint.sh controller

  # Compute Node 1
  compute-01:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: compute-01
    hostname: compute-01
    privileged: true
    volumes:
      - ./compute:/opt/compute
      - ./logs:/var/log/minicloud
      - ./ssh_keys:/root/.ssh_shared
    networks:
      mgmt_net:
        ipv4_address: 192.168.100.21
      guest_net:
        ipv4_address: 10.0.1.21
    command: /usr/local/bin/entrypoint.sh compute

  # Compute Node 2
  compute-02:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: compute-02
    hostname: compute-02
    privileged: true
    volumes:
      - ./compute:/opt/compute
      - ./logs:/var/log/minicloud
      - ./ssh_keys:/root/.ssh_shared
    networks:
      mgmt_net:
        ipv4_address: 192.168.100.22
      guest_net:
        ipv4_address: 10.0.1.22
    command: /usr/local/bin/entrypoint.sh compute

networks:
  mgmt_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.100.0/24
  guest_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.1.0/24
